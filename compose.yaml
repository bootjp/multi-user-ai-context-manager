name: multi-user-ai-context-manager
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: multi_user_ai_context_manager
      POSTGRES_USER: multi_user_ai_context_manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multi_user_ai_context_manager -d multi_user_ai_context_manager"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgres://multi_user_ai_context_manager:${POSTGRES_PASSWORD}@db:5432/multi_user_ai_context_manager?sslmode=disable
      LISTEN_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/multi-user-ai-context-manager", "health"]
      interval: 10s
      timeout: 4s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  pgdata:
