name: agent-context-test
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: agent_context_test
      POSTGRES_USER: agent_context_test
      POSTGRES_PASSWORD: test-only-not-published
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_context_test -d agent_context_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgres://agent_context_test:test-only-not-published@db:5432/agent_context_test?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
