name: multi-user-ai-context-manager-test
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: multi_user_ai_context_manager_test
      POSTGRES_USER: multi_user_ai_context_manager_test
      POSTGRES_PASSWORD: test-only-not-published
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multi_user_ai_context_manager_test -d multi_user_ai_context_manager_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgres://multi_user_ai_context_manager_test:test-only-not-published@db:5432/multi_user_ai_context_manager_test?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
